      <div style="max-width:800px;margin:2rem auto;font-family:system-ui,sans-serif;padding:0 1rem">
        <h1>PEP-EDIT &mdash; Interactive Peptide Editor &amp; Conformer Generator</h1>
        <p>
          PEP-EDIT is a free web application for building, editing and exporting peptide
          representations in 1D (BILN, HELM, SMILES, InChI), 2D (SDF) and 3D (PDB, mmCIF, MOL2, XYZ).
        </p>
        <h2>Key features</h2>
        <ul>
          <li>Build peptides from a BILN sequence, FASTA upload, or the interactive monomer library.</li>
          <li>Support for non-standard monomers: D-amino acids, N-methylated residues, peptidomimetics, capping groups and more.</li>
          <li>Linear, cyclic (head-to-tail, disulfide), branched and multi-chain architectures.</li>
          <li>Conformational constraints &mdash; secondary-structure presets or 3D template from PDB/mmCIF.</li>
          <li>Conformer generation with adjustable protonation (pH&nbsp;7.4 default).</li>
          <li>Export to 12+ formats: BILN, HELM, SMILES, InChI, SDF, PDB, mmCIF, XYZ, MOL2, PDBQT.</li>
          <li>Personal and public monomer libraries with moderated contribution.</li>
        </ul>
        <p>
