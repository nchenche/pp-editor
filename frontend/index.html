<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peptide Editor</title>
    <script type="text/javascript" src="https://unpkg.com/ngl@latest/dist/ngl.js"></script>

    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="/static/dist/css/styles.css">
    

</head>
<body>

    <div class="my-5">
        <!--Tabs navigation-->
<ul
class="mb-5 flex list-none flex-row flex-wrap border-b-0 ps-0"
role="tablist"
data-twe-nav-ref>
<li role="presentation">
  <a
    href="#tabs-home"
    class="my-2 block border-x-0 border-b-2 border-t-0 border-transparent px-7 pb-3.5 pt-4 text-xs font-medium uppercase leading-tight text-neutral-500 hover:isolate hover:border-transparent hover:bg-neutral-100 focus:isolate focus:border-transparent data-[twe-nav-active]:border-primary data-[twe-nav-active]:text-primary dark:text-white/50 dark:hover:bg-neutral-700/60 dark:data-[twe-nav-active]:text-primary"
    data-twe-toggle="pill"
    data-twe-target="#tabs-home"
    data-twe-nav-active
    role="tab"
    aria-controls="tabs-home"
    aria-selected="true"
    >Home</a
  >
</li>
<li role="presentation">
  <a
    href="#tabs-profile"
    class="my-2 block border-x-0 border-b-2 border-t-0 border-transparent px-7 pb-3.5 pt-4 text-xs font-medium uppercase leading-tight text-neutral-500 hover:isolate hover:border-transparent hover:bg-neutral-100 focus:isolate focus:border-transparent data-[twe-nav-active]:border-primary data-[twe-nav-active]:text-primary dark:text-white/50 dark:hover:bg-neutral-700/60 dark:data-[twe-nav-active]:text-primary"
    data-twe-toggle="pill"
    data-twe-target="#tabs-profile"
    role="tab"
    aria-controls="tabs-profile"
    aria-selected="false"
    >Profile</a
  >
</li>
<li role="presentation">
  <a
    href="#tabs-messages"
    class="my-2 block border-x-0 border-b-2 border-t-0 border-transparent px-7 pb-3.5 pt-4 text-xs font-medium uppercase leading-tight text-neutral-500 hover:isolate hover:border-transparent hover:bg-neutral-100 focus:isolate focus:border-transparent data-[twe-nav-active]:border-primary data-[twe-nav-active]:text-primary dark:text-white/50 dark:hover:bg-neutral-700/60 dark:data-[twe-nav-active]:text-primary"
    data-twe-toggle="pill"
    data-twe-target="#tabs-messages"
    role="tab"
    aria-controls="tabs-messages"
    aria-selected="false"
    >Messages</a
  >
</li>
<li role="presentation">
  <a
    href="#tabs-contact"
    class="disabled pointer-events-none my-2 block border-x-0 border-b-2 border-t-0 border-transparent bg-transparent px-7 pb-3.5 pt-4 text-xs font-medium uppercase leading-tight text-neutral-400 hover:isolate hover:border-transparent hover:bg-neutral-100 focus:isolate focus:border-transparent dark:text-neutral-600"
    data-twe-toggle="pill"
    data-twe-target="#tabs-contact"
    role="tab"
    aria-controls="tabs-contact"
    aria-selected="false"
    >Contact</a
  >
</li>
</ul>

<!--Tabs content-->
<div class="mb-6">
<div
  class="hidden opacity-100 transition-opacity duration-150 ease-linear data-[twe-tab-active]:block"
  id="tabs-home"
  role="tabpanel"
  aria-labelledby="tabs-home-tab"
  data-twe-tab-active>
  Tab 1 content
</div>
<div
  class="hidden opacity-0 transition-opacity duration-150 ease-linear data-[twe-tab-active]:block"
  id="tabs-profile"
  role="tabpanel"
  aria-labelledby="tabs-profile-tab">
  Tab 2 content
</div>
<div
  class="hidden opacity-0 transition-opacity duration-150 ease-linear data-[twe-tab-active]:block"
  id="tabs-messages"
  role="tabpanel"
  aria-labelledby="tabs-profile-tab">
  Tab 3 content
</div>
<div
  class="hidden opacity-0 transition-opacity duration-150 ease-linear data-[twe-tab-active]:block"
  id="tabs-contact"
  role="tabpanel"
  aria-labelledby="tabs-contact-tab">
  Tab 4 content
</div>
</div>
    </div>

    <!-- Button trigger modal -->
<button
type="button"
class="inline-block rounded bg-primary px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal text-white shadow-primary-3 transition duration-150 ease-in-out hover:bg-primary-accent-300 hover:shadow-primary-2 focus:bg-primary-accent-300 focus:shadow-primary-2 focus:outline-none focus:ring-0 active:bg-primary-600 active:shadow-primary-2 dark:shadow-black/30 dark:hover:shadow-dark-strong dark:focus:shadow-dark-strong dark:active:shadow-dark-strong"
data-twe-toggle="modal"
data-twe-target="#exampleModal"
data-twe-ripple-init
data-twe-ripple-color="light">
Launch demo modal
</button>

        <form id="container-sequence" class="w-1/2">
            <label for="sequence" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Describe your molecule in BILN</label>
            <textarea id="sequence" rows="2" class="block p-2.5 mb-4 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="P-E-P-T-I-D-E">P-E-P</textarea>
            <button class="inline-flex items-center px-4 py-2 text-xs font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800">
                Load
            </button>
        </form>
        
                  
        <form id="container-secondary-structure" class="w-1/2">
            <div class="block mb-2">
                <label for="sequence" class="text-sm font-medium text-gray-900 dark:text-white">Enter a secondary structure OR 
                    <button class="inline-flex items-center ml-2 px-3 py-1.5 text-xs font-medium text-center text-white bg-gray-700 rounded-lg hover:bg-gray-800">Predict     
                    </button>                
                </label>
            </div>

            <div class="relative">
                <div id="spinner-ss" role="status" class="absolute inset-0 flex justify-center items-center h-full bg-white opacity-50 hidden">

                </div>    
                <textarea id="sequence" rows="2" class="block p-2.5 mb-4 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="-HHHHH-"></textarea>
            </div>

            <button id="generate-ss" class="inline-flex items-center px-4 py-2 text-xs font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800">
                Generate
            </button>
        </form>

        <div id="viewport" style="width:500px; height:500px;">
            <div id="spinner" role="status" class="relative flex justify-center items-center h-full bg-white opacity-50 hidden">
                <svg aria-hidden="true" class="z-10 w-12 h-12 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/><path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/></svg>
